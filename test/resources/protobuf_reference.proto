syntax = "proto3";
package serializer_reference;
enum Choice { first_value = 0; second_value = 1; }
message Child { int32 number = 1; string text = 2; }
message Payload { oneof selection { int32 number = 1; Choice selected = 2; } }
message Record {
  int32 signed_value = 1;
  uint64 large_value = 2;
  string display_name = 3;
  bool flag = 4;
  float fraction = 5;
  double precise = 6;
  Choice selection = 7;
  repeated int32 numbers = 8;
  map<string, uint64> counts = 9;
  Child nested = 10;
  Payload payload = 11;
  repeated bool flags = 12;
  int32 small = 13;
  uint32 character = 14;
}
