[cpp]
protocols = binary_none

[xml]
enabled = true
runtime_xsd = true
validation_scope = both

[xml.class.shapes::record]
attributes = big, flag

[xml.class.shapes::price]
namespace = urn:serializer:vocabulary
attributes = currency
text = value

[xml.class.shapes::catalog]
namespace = urn:serializer:vocabulary
name.prices = price
name.labels = label
wrapper.prices = prices
wrapper.labels = labels
