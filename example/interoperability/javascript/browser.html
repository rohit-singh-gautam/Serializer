<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Serializer browser round trip</title>
<style>
  body { font: 16px system-ui, sans-serif; max-width: 780px; margin: 4rem auto; padding: 0 1rem; }
  pre { background: #f0f3f7; padding: 1.25rem; white-space: pre-wrap; border-radius: 8px; }
</style>
<h1>One schema, five languages</h1>
<p>This browser uses the same generated JavaScript module as the Node.js example.
It also reads the C++ producer's fixture when the interoperability test has run.</p>
<pre id="result">Running…</pre>
<script type="module">
import {InteropMessage, Protocol} from './schema.mjs';
const result = document.querySelector('#result');
try {
  const value = new InteropMessage();
  value.text = 'Hello from the browser 🚀';
  const lines = [];
  for (const [name, protocol] of Object.entries(Protocol)) {
    const encoded = value.encode(protocol);
    const decoded = InteropMessage.decode(encoded, protocol);
    if (decoded.text !== value.text || decoded.bigUnsigned !== 18446744073709551615n) throw new Error('Round trip mismatch');
    lines.push(`${name}: ${encoded.length} bytes; uint64 = ${decoded.bigUnsigned}`);
  }
  const response = await fetch('../../fixtures/cpp_BINARY_INTEGER_0.bin');
  if (!response.ok) throw new Error('Run the interoperability CTest first to create C++ fixtures.');
  const cpp = InteropMessage.decode(new Uint8Array(await response.arrayBuffer()), Protocol.BINARY_INTEGER);
  if (cpp.payloadNumber !== -1234567890123456789n || cpp.children[1].code !== -9) throw new Error('C++ fixture mismatch');
  lines.push('C++ → browser: values preserved', 'PASS');
  result.textContent = lines.join('\n');
  document.documentElement.dataset.result = 'pass';
} catch (error) {
  result.textContent = String(error);
  document.documentElement.dataset.result = 'fail';
}
</script>
</html>
