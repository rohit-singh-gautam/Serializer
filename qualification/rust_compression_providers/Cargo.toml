[package]
name = "serializer-compression-providers"
version = "0.0.0"
edition = "2021"
publish = false
license = "0BSD"

[features]
default = []
zstd = ["dep:zstd"]
lz4 = ["dep:lz4_flex"]

[dependencies]
zstd = { version = "=0.14.0", default-features = false, optional = true }
lz4_flex = { version = "=0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"], optional = true }
